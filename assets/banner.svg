<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatLeft {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 25px) scale(1.1); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { stroke-dashoffset: 40; opacity: 0.8; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      .orb-1 { animation: floatLeft 12s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: floatRight 15s ease-in-out infinite; transform-origin: center; }
      .dynamic-beam { stroke-dasharray: 8 6; animation: pulseBeam 4s linear infinite; }
      .pill-badge { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g opacity="0.65">
    <circle class="orb-1" cx="220" cy="90" r="160" fill="url(#glowGrad1)" />
    <circle class="orb-2" cx="980" cy="190" r="180" fill="url(#glowGrad2)" />
  </g>

  <!-- Background Dynamic Network Flow / Connecting Lines -->
  <g opacity="0.4">
    <path class="dynamic-beam" d="M 120 70 Q 300 20 600 70 T 1080 70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="dynamic-beam" d="M 120 220 Q 400 270 700 220 T 1080 220" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- High-Tech Directory Nodes in Decorative Space -->
  <g opacity="0.7">
    <!-- Left Decorative Node -->
    <rect x="70" y="110" width="80" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="137" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle">LDAP / AD</text>
    <text x="110" y="153" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">v3 / Kerberos</text>

    <!-- Right Decorative Node -->
    <rect x="1050" y="110" width="80" height="60" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <text x="1090" y="137" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle">OIDC / SAML</text>
    <text x="1090" y="153" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">SCIM 2.0</text>
  </g>

  <!-- FOREGROUND: Distinct Title, Subtitle, and Tagline (Always clear and visible) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 42)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-118" cy="0" r="4" fill="#10b981" />
      <text x="-106" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED ENTERPRISE DIRECTORY STACK</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="105" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
      Awesome Enterprise Directory Integration
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="142" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16">
      Production Identity Orchestration • LDAP &amp; Active Directory Federation • Cloud IAM &amp; Open Source
    </text>

    <!-- Tagline & Highlights -->
    <text x="600" y="172" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="13">
      Comprehensive benchmarks, transparent SaaS pricing, free tier quotas &amp; GitHub star metrics
    </text>

    <!-- Feature Pills (Centered row) -->
    <g transform="translate(600, 222)">
      <!-- Pill 1: LDAP & AD -->
      <g transform="translate(-270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">⚡ OpenLDAP &amp; AD</text>
      </g>
      <!-- Pill 2: Modern SSO & OIDC -->
      <g transform="translate(-135, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">🔑 Keycloak &amp; OIDC</text>
      </g>
      <!-- Pill 3: Self-Hosted & Linux -->
      <g transform="translate(0, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">🐧 FreeIPA &amp; Samba</text>
      </g>
      <!-- Pill 4: Rust & Lightweight -->
      <g transform="translate(135, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">🦀 Kanidm &amp; LLDAP</text>
      </g>
      <!-- Pill 5: Cloud IAM -->
      <g transform="translate(270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">☁️ Entra, Okta &amp; AWS</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#334155" stroke-opacity="0.8" />
</svg>
